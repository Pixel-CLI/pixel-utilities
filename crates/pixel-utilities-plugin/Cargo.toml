# SPDX-License-Identifier: MIT

[package]
name = "pixel-utilities-plugin"
description = "Pixel plugin: web-search, check-release and ai-cli-readify behind one pixel-utilities binary."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "pixel_utilities_plugin"
path = "src/lib.rs"

# The only binary. `pixel-utilities <command> ...` runs a command; the same
# binary invoked as `pixel-<command>` (a link made by `pixel-utilities
# install-links`) runs that command, which is what `pixel <command>` looks for
# on PATH.
[[bin]]
name = "pixel-utilities"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
libc = "0.2"
pixel-daemon = { workspace = true }
pixel-index = { workspace = true }
pixel-install = { workspace = true }
pixel-proto = { workspace = true }
pixel-release = { workspace = true }
regex = "1.13"
serde = { workspace = true }
serde-saphyr = "1.3"
serde_json = { workspace = true }
tempfile = { workspace = true, optional = true }
toml_edit = "0.25.15"
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }

[features]
# Fixtures and the comparison with the core built-in used by the tests.
testing = ["dep:tempfile"]

[dev-dependencies]
pixel-utilities-plugin = { path = ".", features = ["testing"] }
tempfile = { workspace = true }
